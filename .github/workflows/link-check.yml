name: Link check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/link-check.yml'
      - '.lycheeignore'
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/link-check.yml'
      - '.lycheeignore'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --cache
            --max-cache-age 1w
            --accept 200,204,206,403,429
            --exclude-mail
            './**/*.md'
          fail: false

      - name: Open issue on failure
        if: env.lychee_exit_code != '0' && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: 'Link check report ${{ steps.lychee.outputs.runtime }}'
          content-filepath: ./lychee/out.md
          labels: |
            broken-link
            automated

      - name: Fail workflow if links broken (PR/push only)
        if: env.lychee_exit_code != '0' && github.event_name != 'schedule'
        run: |
          echo "::error::Link check found broken links. See the lychee output above."
          exit 1
